name: plumber
base: core24
version: '3.1'
summary: Media trimmer/downloader for Linux Desktop
description: |
  Powerful Media trimmer/downloader, Video to GIF creator for Linux Desktop.

grade: stable
confinement: strict
icon: snap/gui/icon.png
compression: lzo

platforms:
  amd64:
  arm64:

apps:
  plumber:
    command: usr/bin/plumber
    extensions: [kde-neon-6]
    desktop: usr/share/applications/plumber.desktop
    plugs:
      - audio-playback
      - gsettings
      - home
      - mount-observe
      - network
      - network-bind
      - opengl
      - removable-media
      - unity7
      - wayland
      - x11

parts:
  application:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      # The SDK snap's libpulse.so.0 (pulled in by Qt6::Multimedia) keeps
      # its private libpulsecommon in a pulseaudio/ subdirectory the build
      # container's linker does not search, failing the link with undefined
      # pa_* references. Snap-build-only quirk; runtime is unaffected.
      - -DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath-link,/snap/kde-qt6-core24-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pulseaudio
    override-build: |
      craftctl default
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/plumber.png|' ${CRAFT_PART_INSTALL}/usr/share/applications/plumber.desktop
