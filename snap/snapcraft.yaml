name: plumber
base: core24
version: '3.1'
summary: Media trimmer/downloader for Linux Desktop
description: |
  Powerful Media trimmer/downloader, Video to GIF creator for Linux Desktop.

grade: stable
confinement: strict
icon: snap/gui/icon.png
compression: lzo

platforms:
  amd64:
  arm64:

apps:
  plumber:
    command: usr/bin/plumber
    # gio-env registers the runtime's GIO modules (TLS for https streams)
    command-chain: [bin/gio-env]
    extensions: [kde-neon-6]
    desktop: usr/share/applications/plumber.desktop
    environment:
      # The recording pipeline shells out to the bundled parec/lame
      PATH: $SNAP/usr/bin:$SNAP/usr/local/bin:$PATH
    plugs:
      - audio-playback
      - gsettings
      - home
      - mount-observe
      - network
      - network-bind
      - opengl
      - removable-media
      - unity7
      - wayland
      - x11

parts:
  application:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
    build-packages:
      # Gives the linker a resolvable libpulse (the SDK snap's copy has
      # its private libpulsecommon out of the linker's search path) —
      # same convention as the other Qt6::Multimedia snaps (glate-ng,
      # ArrowEscape, HungrySnake, TypingMaster).
      - libpulse-dev
    override-build: |
      craftctl default
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/plumber.png|' ${CRAFT_PART_INSTALL}/usr/share/applications/plumber.desktop

  launcher:
    plugin: dump
    source: snap/local
    organize:
      gio-env: bin/gio-env
